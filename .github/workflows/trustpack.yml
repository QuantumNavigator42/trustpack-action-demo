name: Generate TrustPack

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: read

jobs:
  trustpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate repository security evidence pack
        uses: QuantumNavigator42/trustpack-action@v0.1.0
        with:
          output-dir: trustpack
          company-name: TrustPack Demo
          product-name: TrustPack Action
          include-html: "true"
          fail-on-high-risk-workflows: "false"

      - name: Upload TrustPack artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: trustpack
          path: trustpack
          if-no-files-found: error
